<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>

<div class="login-container">
    <!-- Menggunakan div biasa, BUKAN <form>, agar bebas error 405 -->
    <div class="form-card">
        <h2>Login Admin</h2>

        <label>Username</label>
        <input type="text" id="username" placeholder="Masukkan username" required>

        <label>Password</label>
        <input type="password" id="password" placeholder="Masukkan password" required>

        <!-- Gunakan type="button" agar tidak memicu submit/refresh -->
        <button type="button" onclick="prosesLogin()">Login</button>
    </div>
</div>

<!-- Animasi Gelembung Aquatic Background -->
<div class="bubble"></div>
<div class="bubble"></div>
<div class="bubble"></div>
<div class="bubble"></div>
<div class="bubble"></div>

<script>
    function prosesLogin() {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;

        if (user === "" || pass === "") {
            alert("Harap isi Username dan Password!");
        } else {
            alert("Login Berhasil! (Simulasi Tampilan GitHub Pages)");
        }
    }
</script>

</body>
</html>
