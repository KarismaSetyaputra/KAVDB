    <style>
        .landing-box {
            max-width: 500px;
            margin: 100px auto;
            padding: 40px;
            text-align: center;
            background: var(--glass-bg, rgba(10, 35, 60, 0.65));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border, rgba(0, 212, 255, 0.25));
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            position: relative;
            z-index: 1;
        }

        .landing-box h1 {
            color: #ffffff;
            font-size: 1.8rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px var(--glow-color, rgba(0, 212, 255, 0.4));
        }

        .landing-box p {
            color: var(--text-color, #e0f7fc);
            font-size: 1rem;
            margin-bottom: 25px;
        }

        .loader {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(0, 212, 255, 0.2);
            border-top: 4px solid var(--accent-cyan, #00d4ff);
            border-radius: 50%;
            margin: 0 auto 20px auto;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn-direct {
            display: inline-block;
            background: var(--button-bg, linear-gradient(135deg, #0077b6, #00b4d8));
            color: #ffffff;
            padding: 10px 24px;
            border-radius: 6px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(0, 180, 216, 0.3);
        }

        .btn-direct:hover {
            background: var(--button-hover, linear-gradient(135deg, #0096c7, #48cae4));
            box-shadow: 0 0 15px var(--glow-color, rgba(0, 212, 255, 0.4));
            transform: translateY(-2px);
            color: #ffffff;
        }
    </style>
